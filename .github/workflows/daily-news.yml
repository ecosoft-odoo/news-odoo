name: Odoo Daily News

on:
  schedule:
    # 00:30 UTC = 07:30 ICT (Asia/Bangkok)
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD), empty = yesterday ICT"
        required: false
        type: string
        default: ""
      repo:
        description: "Override matrix with a single repo (owner/name). Empty = run all matrix repos."
        required: false
        type: string
        default: ""
      branch:
        description: "Override branch (only used with single-repo override). Default 18.0."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry-run (fetch, no Discord post)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialise sends and history updates, including manual runs.
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - id: set
        run: |
          # Default subscription list. Edit here to add/remove repos.
          # Manual single-repo override wins.
          if [ -n "${{ github.event.inputs.repo }}" ]; then
            BR="${{ github.event.inputs.branch }}"
            [ -z "$BR" ] && BR="18.0"
            TARGETS="[{\"repo\":\"${{ github.event.inputs.repo }}\",\"branch\":\"$BR\"}]"
          else
            TARGETS='[{"repo":"odoo/odoo","branch":"18.0"}]'
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Resolved targets: $TARGETS"

  daily-news:
    needs: resolve-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/fetch_and_post.py "${{ github.event.inputs.date }}" \
            --repo "${{ matrix.target.repo }}" \
            --branch "${{ matrix.target.branch }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

  record-history:
    needs: daily-news
    if: ${{ needs.daily-news.result == 'success' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Get the current default branch after all targets have been sent.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Record last successful Discord send
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          history = {
              "sent_at": datetime.now(ZoneInfo("Asia/Bangkok")).isoformat(timespec="seconds"),
              "status": "sent",
          }
          Path("history.json").write_text(json.dumps(history) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[LOG] record successful Discord send"
          git push
